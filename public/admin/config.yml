# Decap CMS config for the CEC corporate platform.
#
# Local editing works right now with zero setup: run `npm run cms` in one terminal
# and `npm run dev` in another, then open http://localhost:5183/admin — edits save
# straight to the JSON files under src/data/ via git commits on this machine.
# `local_backend: true` is what makes that work.
#
# To let a real team edit this from anywhere (not just this machine):
#   1. Push this repo to GitHub (or GitLab/Bitbucket).
#   2. Deploy the site (Netlify is the zero-config path for `git-gateway` below —
#      enable Netlify Identity + Git Gateway in the Netlify site settings).
#   3. Update the `repo` line below to your actual GitHub "owner/repo".

backend:
  name: git-gateway
  branch: master
  # repo: your-github-username/your-repo-name

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/data/settings.json"
        label: "Group Settings"
        name: "settings"
        fields:
          - label: "Parent Company (CEC)"
            name: "parent"
            widget: "object"
            fields:
              - { label: "Short Name", name: "name", widget: "string" }
              - { label: "Full Legal Name", name: "fullName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero Image", name: "image", widget: "image" }
          - label: "Group Performance Metrics"
            name: "groupMetrics"
            widget: "list"
            summary: "{{label}}: {{value}}{{suffix}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "number" }
              - { label: "Suffix", name: "suffix", widget: "string", required: false }

  - name: "entities"
    label: "Entities (Subsidiaries & Strategic Partner)"
    files:
      - file: "src/data/entities.json"
        label: "All 6 Entities"
        name: "entities"
        fields:
          - label: "Entities"
            name: "entities"
            widget: "list"
            summary: "{{fields.name}} ({{fields.kind}})"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used at /our-business/[slug] — avoid changing after launch" }
              - label: "Kind"
                name: "kind"
                widget: "select"
                options: ["subsidiary", "strategic-partner"]
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Full Legal Name", name: "fullName", widget: "string" }
              - { label: "Hero Image", name: "image", widget: "image" }
              - { label: "Logo Mark", name: "logo", widget: "image" }
              - { label: "Role / Tagline", name: "role", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - label: "Sub-Divisions"
                name: "subDivisions"
                widget: "list"
                summary: "{{name}}"
                fields:
                  - { label: "Internal ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["dataFlow","hardwareNode","hardHat","compass","crosshair","incubation","sync","telemetry","aviation","sterile","operatorHMI","caliper"]
              - label: "Key Performance Telemetry"
                name: "telemetry"
                widget: "list"
                summary: "{{label}}: {{value}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }

  - name: "about"
    label: "About Page"
    files:
      - file: "src/data/about.json"
        label: "About Content"
        name: "about"
        fields:
          - { label: "Corporate Profile", name: "profile", widget: "text" }
          - { label: "Mission", name: "mission", widget: "text" }
          - { label: "Vision", name: "vision", widget: "text" }
          - label: "Leadership & Governance"
            name: "leadership"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Founder", "Director", "Advisor"]
              - { label: "Avatar Variant (0-5)", name: "seed", widget: "number", min: 0, max: 5 }

  - name: "hse"
    label: "HSE & Compliance"
    files:
      - file: "src/data/hse.json"
        label: "HSE Content"
        name: "hse"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Emergency Drill Schedule"
            name: "drillSchedule"
            widget: "list"
            summary: "{{month}} — {{drill}}"
            fields:
              - { label: "Month", name: "month", widget: "string" }
              - { label: "Drill", name: "drill", widget: "string" }
              - { label: "Area", name: "area", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string" }
          - label: "Scenario Matrix"
            name: "scenarioMatrix"
            widget: "list"
            summary: "{{scenario}} ({{category}})"
            fields:
              - { label: "Scenario", name: "scenario", widget: "string" }
              - label: "Severity Category"
                name: "category"
                widget: "select"
                options: ["Standard", "Advanced", "Critical"]
              - { label: "Protocol", name: "protocol", widget: "text" }
              - { label: "Agencies", name: "agencies", widget: "string" }

  - name: "track_record"
    label: "Track Record"
    files:
      - file: "src/data/trackRecord.json"
        label: "Projects"
        name: "trackRecord"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Related Entity ID", name: "entity", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Blurb", name: "blurb", widget: "text" }
              - { label: "Tall Card", name: "tall", widget: "boolean", default: false }

  - name: "investor_relations"
    label: "Investor Relations"
    files:
      - file: "src/data/investorRelations.json"
        label: "IR Content"
        name: "investorRelations"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Equity Model"
            name: "equityModel"
            widget: "list"
            summary: "{{label}}: {{value}}%"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value (%)", name: "value", widget: "number" }
          - label: "ESOP Vesting Schedule"
            name: "esopVesting"
            widget: "list"
            summary: "{{year}}: {{cumulative}}%"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Cumulative Vested (%)", name: "cumulative", widget: "number" }
              - { label: "Note", name: "note", widget: "string", required: false }
          - label: "Instrument Comparison"
            name: "instruments"
            widget: "list"
            summary: "{{instrument}}"
            fields:
              - { label: "Instrument", name: "instrument", widget: "string" }
              - { label: "Ownership", name: "ownership", widget: "string" }
              - { label: "Voting Rights", name: "voting", widget: "string" }
              - { label: "Liquidity Trigger", name: "liquidity", widget: "string" }

  - name: "careers"
    label: "Careers"
    files:
      - file: "src/data/careers.json"
        label: "Job Board"
        name: "careers"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Job Listings"
            name: "jobs"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Job Title", name: "title", widget: "string" }
              - { label: "Entity ID", name: "entity", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["Full-Time", "Part-Time", "Shift-Based", "Contract"]

  - name: "contact"
    label: "Contact Page"
    files:
      - file: "src/data/contact.json"
        label: "Contact Content"
        name: "contact"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - label: "Offices"
            name: "offices"
            widget: "list"
            summary: "{{name}} — {{city}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Office Name", name: "name", widget: "string" }
              - { label: "City", name: "city", widget: "string" }
              - { label: "Coordinates (display text)", name: "coords", widget: "string" }
              - { label: "Map X (%)", name: "x", widget: "number" }
              - { label: "Map Y (%)", name: "y", widget: "number" }
