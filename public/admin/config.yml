# Decap CMS config for the Clarity Group corporate platform.
#
# Local editing works right now with zero setup: run `npm run cms` in one terminal
# and `npm run dev` in another, then open http://localhost:5183/admin — edits save
# straight to the JSON files under src/data/ via git commits on this machine.
# `local_backend: true` is what makes that work.
#
# To let a real team edit this from anywhere (not just this machine):
#   1. Push this repo to GitHub (or GitLab/Bitbucket).
#   2. Deploy the site (Netlify is the zero-config path for `git-gateway` below —
#      enable Netlify Identity + Git Gateway in the Netlify site settings).
#   3. Update the `repo` line below to your actual GitHub "owner/repo".

backend:
  name: git-gateway
  branch: master
  # repo: your-github-username/your-repo-name

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/data/settings.json"
        label: "Group Settings"
        name: "settings"
        fields:
          - label: "Parent Company (Clarity Group)"
            name: "parent"
            widget: "object"
            fields:
              - { label: "Short Name", name: "name", widget: "string" }
              - { label: "Full Legal Name", name: "fullName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
          - label: "Homepage Hero Slider"
            name: "heroImages"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
          - label: "Group Performance Metrics"
            name: "groupMetrics"
            widget: "list"
            summary: "{{label}}: {{value}}{{suffix}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "number" }
              - { label: "Suffix", name: "suffix", widget: "string", required: false }
          - label: "Homepage Closing CTA Banner"
            name: "ctaBanner"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }
              - { label: "Button Link", name: "buttonLink", widget: "string", hint: "e.g. \"/contact\"" }

  - name: "advantages"
    label: "Homepage — Why Clarity Group"
    files:
      - file: "src/data/advantages.json"
        label: "Advantage Cards"
        name: "advantages"
        fields:
          - label: "Cards"
            name: "items"
            widget: "list"
            summary: "{{stat}} — {{title}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Lowercase, no spaces — used internally, not shown" }
              - { label: "Stat (big number)", name: "stat", widget: "string", hint: "e.g. \"6\", \"3,000+\", \"5+\"" }
              - { label: "Stat Label", name: "statLabel", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Background Image", name: "image", widget: "image" }

  - name: "faq"
    label: "Homepage — FAQ"
    files:
      - file: "src/data/faq.json"
        label: "Frequently Asked Questions"
        name: "faq"
        fields:
          - label: "Questions"
            name: "items"
            widget: "list"
            summary: "{{question}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Lowercase, no spaces — used internally, not shown" }
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "testimonials"
    label: "Homepage — Testimonials"
    files:
      - file: "src/data/testimonials.json"
        label: "Client & Partner Testimonials"
        name: "testimonials"
        fields:
          - label: "Testimonials"
            name: "items"
            widget: "list"
            required: false
            summary: "{{name}} — {{company}}"
            hint: "The testimonial section only appears on the homepage once at least one real, attributable quote is added here — never invent a quote or attribute one to a real person/company without their consent."
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Lowercase, no spaces — used internally, not shown" }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Company", name: "company", widget: "string", required: false }

  - name: "offices"
    label: "Global Offices"
    files:
      - file: "src/data/offices.json"
        label: "Group Office Network"
        name: "offices"
        fields:
          - label: "Offices"
            name: "offices"
            widget: "list"
            summary: "{{name}} — {{city}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Lowercase, no spaces — used internally, not shown" }
              - { label: "Office Name", name: "name", widget: "string" }
              - { label: "City", name: "city", widget: "string", hint: "Used as a fallback map search query if no exact address is set" }
              - { label: "Exact Address", name: "address", widget: "string", required: false, hint: "Full street address — used as the Google Maps query when set, and shown on-page. Leave blank to fall back to City." }
              - label: "Photo Showcase"
                name: "photos"
                widget: "list"
                required: false
                summary: "{{caption}}"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "partners"
    label: "Strategic Partners"
    files:
      - file: "src/data/partners.json"
        label: "External Partner Companies"
        name: "partners"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}} — {{fields.website}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string" }
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Full Legal Name", name: "fullName", widget: "string" }
              - { label: "Relationship", name: "relationship", widget: "string", hint: "e.g. \"Strategic Recruitment Partner\" — shown as a label, not implying ownership" }
              - { label: "Website URL", name: "website", widget: "string" }
              - { label: "Logo (icon mark)", name: "logo", widget: "image", required: false, hint: "Use their real logo — do not substitute a generated one" }
              - { label: "Logo (full lockup w/ wordmark)", name: "logoFull", widget: "image", required: false }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Vision", name: "vision", widget: "text", required: false }
              - { label: "Mission", name: "mission", widget: "text", required: false }
              - label: "Services"
                name: "services"
                widget: "list"
                required: false
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Platform Features"
                name: "platform"
                widget: "object"
                required: false
                fields:
                  - { label: "For Job Seekers", name: "jobSeekers", widget: "list", required: false }
                  - { label: "For Employers", name: "employers", widget: "list", required: false }
              - { label: "Industries Covered", name: "industries", widget: "list", required: false }
              - { label: "Source Countries", name: "sourceCountries", widget: "list", required: false }
              - { label: "Stated Strengths", name: "strengths", widget: "list", required: false }
              - { label: "Fair Employment Principles", name: "fairEmployment", widget: "list", required: false }
              - label: "Contact"
                name: "contact"
                widget: "object"
                required: false
                fields:
                  - { label: "Address", name: "address", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string" }
                  - { label: "Email", name: "email", widget: "string" }

  - name: "worldMapCountries"
    label: "World Map — Workforce & Clientele"
    files:
      - file: "src/data/worldMapCountries.json"
        label: "Countries on the Interactive Map"
        name: "worldMapCountries"
        fields:
          - label: "Countries"
            name: "countries"
            widget: "list"
            summary: "{{flag}} {{name}} — {{fields.directWorkersRaw}} direct / {{fields.indirectWorkersRaw}} indirect"
            fields:
              - { label: "ISO Alpha-3 Code", name: "id", widget: "string", hint: "e.g. \"SGP\", \"MYS\", \"ARE\" — used to match the real country shape on the map" }
              - { label: "Display Name", name: "name", widget: "string", hint: "e.g. \"UAE\" — short name shown on pins/labels" }
              - { label: "Full Name", name: "fullName", widget: "string", required: false, hint: "e.g. \"United Arab Emirates\" — shown in the detail panel if set" }
              - { label: "Flag Emoji", name: "flag", widget: "string" }
              - { label: "Longitude", name: "longitude", widget: "number", value_type: "float", hint: "Real geographic longitude, e.g. 103.8198 for Singapore" }
              - { label: "Latitude", name: "latitude", widget: "number", value_type: "float", hint: "Real geographic latitude, e.g. 1.3521 for Singapore" }
              - { label: "Direct Workers", name: "directWorkersRaw", widget: "number", value_type: "int" }
              - { label: "Indirect Workers", name: "indirectWorkersRaw", widget: "number", value_type: "int" }
              - { label: "Clients Served Here", name: "clients", widget: "list", required: false }
              - { label: "Status", name: "status", widget: "string", hint: "e.g. \"Primary Regional Hub\", \"Active Deployment\"" }
              - { label: "Region", name: "region", widget: "string" }
              - { label: "Established Year", name: "establishedYear", widget: "string", required: false }
              - { label: "Key Projects", name: "keyProjects", widget: "list", required: false }
              - { label: "Contact Person", name: "contactPerson", widget: "string", required: false }
              - { label: "Contact Email", name: "email", widget: "string", required: false }

  - name: "entities"
    label: "Subsidiaries"
    files:
      - file: "src/data/entities.json"
        label: "All 5 Subsidiaries"
        name: "entities"
        fields:
          - label: "Subsidiaries"
            name: "entities"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used at /our-business/[slug] — avoid changing after launch" }
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Full Legal Name", name: "fullName", widget: "string" }
              - { label: "Hero Image", name: "image", widget: "image" }
              - { label: "Logo Mark", name: "logo", widget: "image" }
              - { label: "Role / Tagline", name: "role", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Enable Manpower Request Form", name: "manpowerFormEnabled", widget: "boolean", required: false, default: false, hint: "Used by Durabuild and Clarity E&C" }
              - { label: "App Store URL (Lenix only)", name: "appStoreUrl", widget: "string", required: false }
              - { label: "Play Store URL (Lenix only)", name: "playStoreUrl", widget: "string", required: false }
              - { label: "APK Direct Download URL (Lenix only)", name: "apkUrl", widget: "string", required: false }
              - { label: "YouTube Demo Video ID (Lenix only)", name: "youtubeId", widget: "string", required: false, hint: "Just the ID from youtube.com/watch?v=THIS_PART" }
              - label: "Sub-Divisions"
                name: "subDivisions"
                widget: "list"
                summary: "{{name}}"
                fields:
                  - { label: "Internal ID", name: "id", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["dataFlow","hardwareNode","hardHat","compass","crosshair","incubation","sync","telemetry","aviation","sterile","operatorHMI","caliper","workforce","network"]
              - label: "Key Performance Telemetry"
                name: "telemetry"
                widget: "list"
                summary: "{{label}}: {{value}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }

  - name: "about"
    label: "About Section"
    files:
      - file: "src/data/corporateInformation.json"
        label: "Corporate Information"
        name: "corporateInformation"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "History", name: "history", widget: "text" }
          - label: "Site Photos"
            name: "siteImages"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }

      - file: "src/data/corporateProfile.json"
        label: "Corporate Profile"
        name: "corporateProfile"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Accreditations"
            name: "accreditations"
            widget: "list"
            summary: "{{code}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Code", name: "code", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Use the real accreditation body's logo — leave blank to fall back to a text badge" }
          - { label: "Recruitment License Statement", name: "recruitmentLicense", widget: "text" }
          - label: "Galleries"
            name: "galleries"
            widget: "object"
            fields:
              - label: "Overseas Recruitment"
                name: "overseas"
                widget: "list"
                summary: "{{caption}}"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string" }
              - label: "In-House Recruitment"
                name: "inhouse"
                widget: "list"
                summary: "{{caption}}"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string" }

      - file: "src/data/leadershipTeam.json"
        label: "Leadership Team"
        name: "leadershipTeam"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Managers"
            name: "members"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Avatar Variant (0-5)", name: "seed", widget: "number", min: 0, max: 5 }

      - file: "src/data/founders.json"
        label: "Founders & Advisors"
        name: "founders"
        fields:
          - label: "People"
            name: "people"
            widget: "list"
            summary: "{{name}} ({{role}})"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used at /about/founder-advisor/[slug]" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Role"
                name: "role"
                widget: "select"
                options: ["Founder", "Co-Founder", "Advisor"]
              - { label: "Avatar Variant (0-5)", name: "seed", widget: "number", min: 0, max: 5 }
              - { label: "Qualifications", name: "qualifications", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Licenses", name: "licenses", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Experience", name: "experience", widget: "list", field: { label: "Item", name: "item", widget: "string" } }

      - file: "src/data/missionVision.json"
        label: "Mission & Vision"
        name: "missionVision"
        fields:
          - { label: "Mission", name: "mission", widget: "text" }
          - { label: "Vision", name: "vision", widget: "text" }
          - label: "Values"
            name: "values"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "careers"
    label: "Careers"
    files:
      - file: "src/data/careers.json"
        label: "Job Board"
        name: "careers"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Job Listings"
            name: "jobs"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Job Title", name: "title", widget: "string" }
              - { label: "Entity ID", name: "entity", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["Full-Time", "Part-Time", "Shift-Based", "Contract"]

  - name: "clients"
    label: "Client Logos"
    files:
      - file: "src/data/clients.json"
        label: "Companies We Serve — Scrolling Strip"
        name: "clients"
        fields:
          - label: "Logos"
            name: "logos"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string" }
              - { label: "Company Name", name: "name", widget: "string", hint: "Used as image alt text / hover title" }
              - { label: "Logo", name: "src", widget: "image" }

  - name: "contact"
    label: "Contact Page"
    files:
      - file: "src/data/contact.json"
        label: "Contact Content"
        name: "contact"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
